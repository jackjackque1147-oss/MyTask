name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish .\MyTask.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output .\publish\win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          $env:MYTASK_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          $outputDirectory = (Resolve-Path .\artifacts).Path
          & $compiler "/DMyAppVersion=$env:MYTASK_VERSION" "/O$outputDirectory" .\installer\MyTask.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setupPath = ".\artifacts\MyTask-Setup-v$env:MYTASK_VERSION.exe"
          if (-not (Test-Path $setupPath)) {
            throw "Installer output was not created: $setupPath"
          }
          Copy-Item .\publish\win-x64\MyTask.exe .\artifacts\MyTask.exe
          Compress-Archive -Path .\publish\win-x64\MyTask.exe `
            -DestinationPath ".\artifacts\MyTask-portable-win-x64-v$env:MYTASK_VERSION.zip" `
            -CompressionLevel Optimal
          Get-FileHash .\artifacts\* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content .\artifacts\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: MyTask ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/MyTask-Setup-${{ github.ref_name }}.exe
            artifacts/MyTask.exe
            artifacts/MyTask-portable-win-x64-${{ github.ref_name }}.zip
            artifacts/SHA256SUMS.txt
